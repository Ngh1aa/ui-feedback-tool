name: Sync UI Feedback Tool

on:
  push:
    branches: [main]
    paths:
      - 'src/ui-feedback.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-and-notify:
    name: Notify registered repositories
    runs-on: ubuntu-latest
    steps:
      - name: Discover opt-in repositories and dispatch update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const owner = 'Ngh1aa';
            const sourceRepo = 'ui-feedback-tool';
            const sourceSha = context.sha;
            const registrationFile = '.github/ui-feedback-sync.json';

            const repositories = (await github.paginate(
              github.rest.repos.listForAuthenticatedUser,
              { affiliation: 'owner', visibility: 'all', per_page: 100 }
            )).filter((repository) => repository.owner.login.toLowerCase() === owner.toLowerCase());

            let registered = 0;
            let dispatched = 0;

            for (const repository of repositories) {
              if (repository.name === sourceRepo || repository.archived) continue;

              let registration;
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo: repository.name,
                  path: registrationFile,
                  ref: repository.default_branch,
                });

                const file = Array.isArray(response.data) ? response.data[0] : response.data;
                if (!file || file.type !== 'file' || !file.content) continue;
                registration = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
              } catch (error) {
                if (error.status === 404) continue;
                core.warning(`Could not inspect ${owner}/${repository.name}: ${error.message}`);
                continue;
              }

              if (registration.enabled !== true) continue;
              registered += 1;

              await github.rest.repos.createDispatchEvent({
                owner,
                repo: repository.name,
                event_type: 'ui-feedback-updated',
                client_payload: {
                  source_sha: sourceSha,
                  source_repo: `${owner}/${sourceRepo}`,
                },
              });

              dispatched += 1;
              core.info(`Dispatched UI Feedback ${sourceSha} to ${owner}/${repository.name}`);
            }

            core.notice(`Registered repositories: ${registered}; dispatched updates: ${dispatched}`);
